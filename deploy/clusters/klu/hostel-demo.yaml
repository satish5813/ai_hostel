# Flux: keep hostel-demo equal to deploy/hostel/overlays/demo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hostel-demo
  namespace: flux-system
spec:
  sourceRef: {kind: GitRepository, name: ai-hostel}
  path: ./deploy/hostel/overlays/demo
  interval: 5m
  prune: false
  wait: false
  timeout: 10m
