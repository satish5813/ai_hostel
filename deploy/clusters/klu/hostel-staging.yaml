# Flux: keep hostel-staging equal to deploy/hostel/overlays/staging of this repository.
# Applied once by hand (kubectl apply -f); the read-only token is the cluster's "aihr-pilot-git" secret
# (fine-grained token with Contents: Read-only on aihr_pilot and ai_hostel).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ai-hostel
  namespace: flux-system
spec:
  url: https://github.com/satish5813/ai_hostel
  ref: {branch: k8s-platform}
  interval: 1m
  secretRef: {name: aihr-pilot-git}
  ignore: |
    /*
    !/deploy/hostel/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hostel-staging
  namespace: flux-system
spec:
  sourceRef: {kind: GitRepository, name: ai-hostel}
  path: ./deploy/hostel/overlays/staging
  interval: 5m
  prune: true
  wait: false
  timeout: 10m
