# Flux: the central page (central-portal/ in this repo) at portal.klfacultyhiring.com.
# A static page with no data, so it follows the k8s-platform branch directly (no staging/release step).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portal
  namespace: flux-system
spec:
  sourceRef: {kind: GitRepository, name: ai-hostel}
  path: ./central-portal
  interval: 5m
  prune: true
  wait: true
  timeout: 3m
