# Production (residency.klfacultyhiring.com). Only a release tag changes the image tags: the hostel-release
# workflow re-tags the images staging already ran (same bits, no rebuild) and commits them here; Flux applies them.
# API and web: replicas.yaml (live since 2026-10-16).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hostel-prod
resources:
  - namespace.yaml
  - ../../base
  - backup.yaml
images:
  - name: ghcr.io/satish5813/kl-hostel-api
    newTag: "v1.4.0"
  - name: ghcr.io/satish5813/kl-hostel-web
    newTag: "v1.4.0"
  - name: ghcr.io/satish5813/kl-hostel-migrate
    newTag: "v1.4.0"
configMapGenerator:
  - name: hostel-backup-scripts
    files:
      - backup.sh
      - backup-encrypt.js
      - restore-test.sh
patches:
  - path: replicas.yaml
  - target: {kind: Ingress, name: hostel}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: residency.klfacultyhiring.com
  - target: {kind: StatefulSet, name: postgres}
    patch: |
      - op: add
        path: /metadata/annotations
        value: {kustomize.toolkit.fluxcd.io/prune: disabled}
