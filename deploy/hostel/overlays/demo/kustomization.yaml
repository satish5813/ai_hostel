# Public DEMO (demo-residency.klfacultyhiring.com): demo data only, never real students.
# Database: ai_hostel-data backups/klu_hostel-before-realdata-20261014-1016.dump (taken before any real data).
# Demo sign-in is on (DEMO_LOGIN=1, shared demo password shown on the sign-in page). Follows the production
# release tag (the hostel-release workflow updates both). Reset: restore the same dump again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hostel-demo
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/satish5813/kl-hostel-api
    newTag: "v1.0.0"
  - name: ghcr.io/satish5813/kl-hostel-web
    newTag: "v1.0.0"
  - name: ghcr.io/satish5813/kl-hostel-migrate
    newTag: "v1.0.0"
patches:
  - path: replicas.yaml
  - target: {kind: Ingress, name: hostel}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: demo-residency.klfacultyhiring.com
      # INAUGURATION (from 2026-10-16): the public address also shows the demo. Remove this op to give it back to production.
      - op: add
        path: /spec/rules/-
        value:
          host: residency.klfacultyhiring.com
          http:
            paths:
              - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {name: http}}}}
              - {path: /, pathType: Prefix, backend: {service: {name: web, port: {name: http}}}}
  - target: {kind: StatefulSet, name: postgres}
    patch: |
      - op: add
        path: /metadata/annotations
        value: {kustomize.toolkit.fluxcd.io/prune: disabled}
