# nginx for the central page inside the cluster (nginx-unprivileged listens on 8080).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://cloudflareinsights.com https://klfacultyhiring.com https://residency.klfacultyhiring.com https://inventory.klfacultyhiring.com https://exams.klfacultyhiring.com https://support.klfacultyhiring.com; frame-ancestors 'none'; base-uri 'self'" always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 7d; }
  location / { try_files $uri /index.html; expires -1; }
}
