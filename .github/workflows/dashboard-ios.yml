name: KL Dashboard - iPhone (iOS)

# Builds the leadership app (apps/leaders) for iPhone on GitHub's own Mac, so no Mac of ours is needed.
#   1. always: compiles the app for iPhone without signing (proves the code builds)
#   2. when the Apple secrets are set: signs it with the university's Apple Developer account and uploads it to
#      TestFlight (App Store Connect -> TestFlight -> add the leaders as testers)
# Repository secrets (Settings -> Secrets and variables -> Actions), all from the Apple Developer account:
#   APPLE_TEAM_ID   the 10-character Team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID      App Store Connect API key id      (appstoreconnect.apple.com -> Users and Access -> Integrations
#   ASC_ISSUER_ID   the Issuer ID shown on that page     -> App Store Connect API -> Team Keys, role "Admin")
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_XXXX.p8 file
# Before the first upload: create the app "KL Dashboard" in App Store Connect with bundle id in.kluniversity.kludashboard.
on:
  workflow_dispatch:
  push:
    branches: [k8s-platform]
    paths: ['apps/leaders/**', '.github/workflows/dashboard-ios.yml']

permissions:
  contents: read

concurrency:
  group: dashboard-ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/leaders
    env:
      BUNDLE_ID: in.kluniversity.kludashboard
      API_BASE: https://residency.klfacultyhiring.com
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true
      - name: Prepare the iPhone project
        run: |
          [ -d ios ] || flutter create --platforms=ios --org in.kluniversity --project-name klu_dashboard .
          sed -i '' -E "/RunnerTests/! s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/Runner.xcodeproj/project.pbxproj
          PB=/usr/libexec/PlistBuddy; PL=ios/Runner/Info.plist
          $PB -c "Set :CFBundleDisplayName KL Dashboard" $PL 2>/dev/null || $PB -c "Add :CFBundleDisplayName string KL Dashboard" $PL
          $PB -c "Set :ITSAppUsesNonExemptEncryption false" $PL 2>/dev/null || $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL
          flutter pub get
      - name: Compile for iPhone (no signing)
        run: |
          flutter build ios --release --no-codesign --dart-define=API_BASE=$API_BASE \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Sign and upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.TEAM_ID != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"; chmod 600 "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> ios/Flutter/Release.xcconfig
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive "${AUTH[@]}"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}"
          rm -f "$KEY"
