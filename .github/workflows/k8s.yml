# K3s delivery for KL Residencies. On every push to main / k8s-platform:
#   1. the same checks as ci.yml (scripts/ci/check.sh against PostgreSQL 18)
#   2. three images (api, web, migrate) built, scanned (fixable CRITICAL fails) and pushed to GHCR
#   3. deploy/hostel/overlays/staging points at them; Flux on the cluster rolls staging out
name: K8s - test, build, deploy staging
on:
  push:
    branches: [main, k8s-platform]
    paths-ignore: ['deploy/hostel/**', 'docs/**', '**.md', 'apps/mobile/**']

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_BASE: postgresql://postgres:ci@localhost:5432
      DB: klu_ci
      OIDC_ISSUER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: PostgreSQL 18 client
        run: |
          sudo apt-get install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y postgresql-client-18 >/dev/null
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: All checks
        run: bash scripts/ci/check.sh

  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false   # one image failing must not cancel the others (their logs show their own problems)
      matrix:
        part: [api, web, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.part }}.Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/kl-hostel-${{ matrix.part }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
      - name: Smoke test
        run: |
          img=ghcr.io/${{ github.repository_owner }}/kl-hostel-${{ matrix.part }}:${{ github.sha }}
          case "${{ matrix.part }}" in
            api) docker run --rm --entrypoint node "$img" -e "import('./dist/app.module.js').then(()=>console.log('api modules load')).catch(e=>{console.error(e);process.exit(1)})" ;;
            web) docker run -d --name web -p 8080:8080 "$img"; sleep 3; curl -sf http://127.0.0.1:8080/ | grep -qi '<div id="root"' && curl -sf -o /dev/null http://127.0.0.1:8080/some/deep/link && echo "web serves the app";;
            migrate) docker run --rm --entrypoint sh "$img" -c 'ls /migrations/*.sql | wc -l; psql --version' ;;
          esac
      - name: Vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/kl-hostel-${{ matrix.part }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/kl-hostel-${{ matrix.part }}:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/kl-hostel-${{ matrix.part }}:${GITHUB_SHA::12}
          docker push ghcr.io/${{ github.repository_owner }}/kl-hostel-${{ matrix.part }}:${GITHUB_SHA::12}

  deploy-staging:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history needed to compare builds
      - name: Point staging at the new images (Flux applies them on the cluster)
        # Another run may have bumped the same lines meanwhile: start from the newest branch tip each try
        # (no rebase conflicts), and never move staging back to an older commit's images.
        run: |
          f=deploy/hostel/overlays/staging/kustomization.yaml
          git config user.name "hostel-ci"
          git config user.email "hostel-ci@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then echo "branch moved away from $GITHUB_SHA"; exit 0; fi
            cur=$(sed -n 's/^    newTag: "\(.*\)"/\1/p' "$f" | head -1)
            if [ -n "$cur" ] && [ "$cur" != latest ] && git cat-file -e "$cur^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$cur" && [ "${cur::12}" != "${GITHUB_SHA::12}" ]; then
              echo "staging already runs a newer build ($cur)"; exit 0
            fi
            sed -i "s|^    newTag: .*|    newTag: \"${GITHUB_SHA::12}\"|" "$f"
            git add "$f"
            git commit -q -m "deploy(hostel-staging): ${GITHUB_SHA::12} [skip ci]" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((try * 5))
          done
          echo "could not push the staging bump"; exit 1
