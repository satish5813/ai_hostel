name: K8s - release to production

# Production changes only when a version tag is pushed:   git tag v1.0.0 <code commit> && git push origin v1.0.0
# Tag a code commit (not a "deploy(...) [skip ci]" commit: GitHub skips tag runs on those). The images CI already built
# and ran on staging are re-tagged (no rebuild) and deploy/hostel/overlays/prod is updated; Flux rolls it out.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: k8s-release
  cancel-in-progress: false

env:
  OWNER: ${{ github.repository_owner }}
  DEPLOY_BRANCH: k8s-platform

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
      - name: Check the tag is on the deploy branch
        run: |
          SHA=$(git rev-list -n1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$SHA" "origin/$DEPLOY_BRANCH" \
            || { echo "::error::$GITHUB_REF_NAME ($SHA) is not on $DEPLOY_BRANCH"; exit 1; }
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Re-tag the tested images (no rebuild)
        # the newest ancestor whose images exist, provided nothing outside deploy/ and .github/ changed since it
        run: |
          SRC=""
          for c in $(git rev-list --first-parent -n 30 "$SHA"); do
            git diff --quiet "$c" "$SHA" -- . ':(exclude)deploy' ':(exclude).github' || break
            if docker buildx imagetools inspect "ghcr.io/$OWNER/kl-hostel-api:${c::12}" >/dev/null 2>&1; then SRC="${c::12}"; break; fi
          done
          [ -n "$SRC" ] || { echo "::error::No tested CI images for $GITHUB_REF_NAME - push the commit and wait for the green CI run first"; exit 1; }
          for p in api web migrate; do
            docker buildx imagetools create -t "ghcr.io/$OWNER/kl-hostel-$p:$GITHUB_REF_NAME" "ghcr.io/$OWNER/kl-hostel-$p:$SRC"
          done
          echo "SRC=$SRC" >> "$GITHUB_ENV"
      - name: Point production at the release (Flux applies it)
        run: |
          f=deploy/hostel/overlays/prod/kustomization.yaml
          sed -i "s|^    newTag: .*|    newTag: \"$GITHUB_REF_NAME\"|" "$f"
          git config user.name "hostel-release"
          git config user.email "hostel-release@users.noreply.github.com"
          git add "$f"
          git commit -m "release(hostel-prod): $GITHUB_REF_NAME = $SRC [skip ci]" || exit 0
          git push origin "HEAD:$DEPLOY_BRANCH"
